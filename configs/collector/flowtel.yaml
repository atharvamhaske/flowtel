receivers:
  otlp:
    protocols:
      http: {}
      grpc: {}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  transform/flowtel:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "gen_ai.prompt")
          - delete_key(attributes, "gen_ai.completion")
          - delete_key(attributes, "gen_ai.tool.call.arguments")
          - delete_key(attributes, "gen_ai.tool.call.result")
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "gen_ai.prompt")
          - delete_key(attributes, "gen_ai.completion")
          - delete_key(attributes, "gen_ai.tool.call.arguments")
          - delete_key(attributes, "gen_ai.tool.call.result")
  batch: {}

exporters:
  otlp/phoenix:
    endpoint: ${PHOENIX_OTLP_ENDPOINT}
  otlphttp/braintrust:
    endpoint: ${BRAINTRUST_OTLP_ENDPOINT}
    headers:
      Authorization: "Bearer ${BRAINTRUST_API_KEY}"
      x-bt-parent: "project_id:${BRAINTRUST_PROJECT_ID}"
  otlp/laminar:
    endpoint: ${LAMINAR_OTLP_ENDPOINT}
  otlphttp/greptime:
    endpoint: ${GREPTIME_OTLP_ENDPOINT}
  otlphttp/parseable:
    endpoint: ${PARSEABLE_OTLP_ENDPOINT}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/flowtel, batch]
      exporters: [otlp/phoenix, otlphttp/braintrust, otlp/laminar]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/flowtel, batch]
      exporters: [otlphttp/greptime, otlphttp/parseable]
    metrics:
      # Greptime and Parseable both ingest OTLP metrics; Phoenix,
      # Braintrust, and Laminar don't as of writing, so they're
      # deliberately not exporters here.
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/greptime, otlphttp/parseable]
