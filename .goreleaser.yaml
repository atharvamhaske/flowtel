version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: flowtel
    main: ./cmd/flowtel
    binary: flowtel
    ldflags:
      - -s -w
      - -X github.com/atharvamhaske/flowtel/internal/version.Version={{.Version}}
      - -X github.com/atharvamhaske/flowtel/internal/version.Commit={{.Commit}}
      - -X github.com/atharvamhaske/flowtel/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
