<rect width="1000" height="520" fill="#f5f5f5"/><rect class="z" x="32" y="112" width="200" height="280" rx="8"/><rect class="z" x="272" y="112" width="260" height="280" rx="8"/><rect class="z" x="572" y="112" width="396" height="280" rx="8"/><text class="t" x="48" y="140">HARNESS</text><text class="t" x="288" y="140">FLOWTEL</text><text class="t" x="588" y="140">OTEL DELIVERY</text>
