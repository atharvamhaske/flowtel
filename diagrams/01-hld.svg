<rect class="n" x="56" y="172" width="160" height="80" rx="6"/><text class="s" x="136" y="207" text-anchor="middle">Pi session JSONL</text><text class="m" x="136" y="228" text-anchor="middle">messages · tools · usage</text><rect class="n" x="56" y="292" width="160" height="80" rx="6"/><text class="s" x="136" y="327" text-anchor="middle">Pi extension</text><text class="m" x="136" y="348" text-anchor="middle">allow / deny audit</text>
<rect class="f" x="296" y="192" width="212" height="120" rx="6"/><text class="s" x="402" y="227" text-anchor="middle">Flowtel adapter + IR</text><text class="m" x="402" y="250" text-anchor="middle">session → llm → tool → permission</text><text class="m" x="402" y="272" text-anchor="middle">OI + GenAI spans · OTLP logs</text><rect class="n" x="596" y="212" width="96" height="80" rx="6"/><text class="s" x="644" y="241" text-anchor="middle">Collector</text><text class="m" x="644" y="262" text-anchor="middle">protect · batch</text>
