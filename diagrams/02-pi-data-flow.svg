<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 356" role="img" aria-labelledby="pi-flow-title pi-flow-desc"><title id="pi-flow-title">Pi to Flowtel data flow</title><desc id="pi-flow-desc">Pi session data and permission events move through parsing, normalization, profile rendering, and OTLP export.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#4f5d75"/></marker><marker id="x" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#eb6c36"/></marker></defs><rect width="728" height="356" fill="#f5f5f5"/><line x1="140" y1="36" x2="140" y2="276" stroke="rgba(45,49,66,.12)"/><path class="x" d="M246 84H258"/><path class="a" d="M358 164H370"/><path class="a" d="M470 164H482"/><path class="a" d="M582 244H594"/><path class="a" d="M246 112H258Q266 112 266 120V164Q266 172 274 172H370" stroke-dasharray="4 3"/>
<text class="m" x="70" y="78" text-anchor="middle">PI</text><text class="m" x="70" y="158" text-anchor="middle">FLOWTEL</text><text class="m" x="70" y="238" text-anchor="middle">OTEL</text><text class="m" x="196" y="28" text-anchor="middle">01 CAPTURE</text><text class="m" x="308" y="28" text-anchor="middle">02 PARSE</text><text class="m" x="420" y="28" text-anchor="middle" fill="#eb6c36">03 NORMALIZE</text><text class="m" x="532" y="28" text-anchor="middle">04 RENDER</text><text class="m" x="644" y="28" text-anchor="middle">05 EXPORT</text>
<rect class="n" x="146" y="44" width="100" height="64" rx="6"/><text class="s" x="196" y="72" text-anchor="middle">Session JSONL</text><text class="m" x="196" y="91" text-anchor="middle">LS → DB</text><rect class="n" x="146" y="124" width="100" height="64" rx="6"/><text class="s" x="196" y="152" text-anchor="middle">Permission hook</text><text class="m" x="196" y="171" text-anchor="middle">LS → DB</text><rect class="f" x="258" y="124" width="100" height="64" rx="6"/><text class="s" x="308" y="152" text-anchor="middle">Parse + link</text><text class="m" x="308" y="171" text-anchor="middle">DB → LS</text><rect class="n" x="370" y="124" width="100" height="64" rx="6"/><text class="s" x="420" y="152" text-anchor="middle">Event IR</text><text class="m" x="420" y="171" text-anchor="middle">LS → LS</text><rect class="n" x="482" y="204" width="100" height="64" rx="6"/><text class="s" x="532" y="232" text-anchor="middle">Both profiles</text><text class="m" x="532" y="251" text-anchor="middle">LS → LS</text><rect class="n" x="594" y="204" width="100" height="64" rx="6"/><text class="s" x="644" y="232" text-anchor="middle">OTLP</text><text class="m" x="644" y="251" text-anchor="middle">LS → FL</text>
